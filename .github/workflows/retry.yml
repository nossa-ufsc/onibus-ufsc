name: Retry Ônibus

# Se o site do Fênix não responder para o IP de um runner, retry dentro do job não ajuda (o IP
# não muda). Este workflow observa o fim do "Coletar Ônibus" e, se falhou, reexecuta em um
# runner novo, até 3 tentativas no total (o workflow_run dispara de novo a cada rerun).

on:
  workflow_run:
    workflows: ["Coletar Ônibus"]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          echo "Tentativa $RUN_ATTEMPT falhou; aguardando antes do rerun…"
          sleep 120
          gh run rerun "$RUN_ID" --failed --repo "$REPO"
